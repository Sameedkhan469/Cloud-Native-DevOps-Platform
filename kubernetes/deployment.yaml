
apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-flask-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: devops-flask

  template:
    metadata:
      labels:
        app: devops-flask

    spec:
      containers:
        - name: flask-container
          image: devops-flask-app:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: devops-flask-config
            - secretRef:
                name: devops-flask-secret

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
