
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: devops-flask-ingress
  namespace: development

spec:
  ingressClassName: nginx

  rules:
    - host: dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-flask-dev-service
                port:
                  number: 5000
